name: granite_climbing_app
description: Minimal Flutter mobile shell for the Granite climbing guide.
publish_to: 'none'
version: 1.1.1+24

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.12.0
  webview_flutter_wkwebview: ^3.25.1
  url_launcher: ^6.3.2
  share_plus: ^13.1.0
  http: ^1.6.0
  kakao_flutter_sdk_user: ^2.0.0+1
  naver_login_sdk: ^3.2.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  webview_flutter_platform_interface: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
