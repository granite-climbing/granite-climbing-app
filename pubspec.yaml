name: granite_climbing_app
description: Minimal Flutter mobile shell for the Granite climbing guide.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^6.1.0
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.2
  share_plus: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  webview_flutter_platform_interface: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/offline_web/
    - assets/offline_web/images/
